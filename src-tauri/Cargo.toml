[package]
name = "inkforge"
version = "1.0.0-alpha.1"
description = "InkForge: professional handwriting and font studio"
authors = ["Parham Fallah"]
license = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "inkforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "InkForge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
